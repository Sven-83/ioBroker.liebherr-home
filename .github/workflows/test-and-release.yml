name: Test and Release

# Run this job on all pushes and pull requests
# as well as tags with a semantic version
on:
  push:
    branches:
      - "main"
    tags:
      # normal versions
      - "v[0-9]+.[0-9]+.[0-9]+"
      # pre-releases
      - "v[0-9]+.[0-9]+.[0-9]+-**"
  pull_request: {}

# Cancel previous PR/branch runs when a new commit is pushed
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Performs quick checks before the expensive test runs
  check-and-lint:
    if: contains(github.event.head_commit.message, '[skip ci]') == false

    runs-on: ubuntu-latest

    steps:
      - uses: ioBroker/testing-action-check@v2
        with:
          node-version: '24.x'
          # Uncomment the following line if your adapter cannot be installed using 'npm ci'
          # install-command: 'npm install'
          type-checking: true
          lint: true

  # Fails on critical advisories in runtime dependencies (high: node-forge via adapter-core, see audit N3)
  audit:
    if: contains(github.event.head_commit.message, '[skip ci]') == false

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm audit --omit=dev --audit-level=critical --prefix src-widgets

  # Lints the VIS-2 widget set and checks that the committed widgets/ matches a fresh build
  widgets:
    if: contains(github.event.head_commit.message, '[skip ci]') == false

    # widgets/ is built on Windows; rolldown splits the chunks differently on Linux (same code, other file names)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
      - run: npm ci
      - run: npm ci --prefix src-widgets
      - run: npm run lint:widgets
      - run: npm run build:widgets
      - name: widgets/ is up to date
        shell: bash
        run: |
          git add --intent-to-add widgets
          git diff --exit-code --stat -- widgets || (echo "::error::widgets/ is outdated, run npm run build:widgets and commit the result" && exit 1)
      - name: Upload the fresh build for comparison
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: widgets-ci-build
          path: widgets/
          include-hidden-files: true

  # Runs adapter tests on all supported node versions and OSes
  adapter-tests:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    needs: [check-and-lint]

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: ioBroker/testing-action-adapter@v1
        with:
          node-version: ${{ matrix.node-version }}
          os: ${{ matrix.os }}
          # Uncomment the following line if your adapter cannot be installed using 'npm ci'
          # install-command: 'npm install'
          build: true

