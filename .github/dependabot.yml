version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: cron
      cronjob: "29 4 21 * *"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15
    assignees:
      - Sven-83
    versioning-strategy: increase
    ignore:
      # @types/node follows the minimum supported Node.js version, not the latest
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # VIS-2 widget project; widgets/ has to be rebuilt by hand (npm run build:widgets) after an update
  - package-ecosystem: npm
    directory: "/src-widgets"
    schedule:
      interval: cron
      cronjob: "41 4 21 * *"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15
    assignees:
      - Sven-83
    versioning-strategy: increase

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "52 4 21 * *"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15
    assignees:
      - Sven-83
